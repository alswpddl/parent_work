<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173a5e" />
    <title>가염식품 — 통영 멸치액젓 주문</title>
    <!-- 카톡·문자에 링크를 붙였을 때 보이는 미리보기 (손님 주소 gayeom.vercel.app 기준) -->
    <meta name="description" content="통영 가염식품 공장에서 담근 멸치액젓을 바로 주문하세요. 1.8kg · 5kg · 20kg, 계좌 입금 · 카드 결제." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="가염식품" />
    <meta property="og:title" content="가염식품 — 통영 멸치액젓 주문" />
    <meta property="og:description" content="공장에서 담근 멸치액젓을 바로 보내 드려요. 1.8kg · 5kg · 20kg" />
    <meta property="og:url" content="https://gayeom.vercel.app/" />
    <meta property="og:image" content="https://gayeom.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // 부모님용 관리 화면만 (손님 주소 gayeom.vercel.app 에는 안 붙임 — src/lib/host.ts 와 같이 고쳐요)
      // '앱 설치'·'공유하기'가 되게 (손님 주문서에는 안 붙임)
      if (location.hostname !== "gayeom.vercel.app" && !/^\/(shop|o)(\/|$)/.test(location.pathname)) {
        var m = document.createElement("link");
        m.rel = "manifest";
        m.href = "/manifest.webmanifest";
        document.head.appendChild(m);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

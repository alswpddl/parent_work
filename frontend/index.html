<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#173a5e" />
    <title>공장 주문·출고 도우미</title>
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      // 부모님용 관리 화면만 (손님 주소 gayeom.vercel.app 에는 안 붙임 — src/lib/host.ts 와 같이 고쳐요)
      // '앱 설치'·'공유하기'가 되게 (손님 주문서에는 안 붙임)
      if (location.hostname !== "gayeom.vercel.app" && !/^\/(shop|o)(\/|$)/.test(location.pathname)) {
        var m = document.createElement("link");
        m.rel = "manifest";
        m.href = "/manifest.webmanifest";
        document.head.appendChild(m);
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# 정기 작업 — Render 무료 서버는 잠들기 때문에 서버 안 스케줄러 대신 여기서 깨워서 실행한다.
#
# 필요한 설정 (저장소 Settings → Secrets and variables → Actions)
#   Variables: API_BASE_URL  예) https://factory-ops-api.onrender.com
#   Secrets:   JOB_SECRET    (Render 환경변수 JOB_SECRET 과 같은 값)
#
# GitHub cron 은 UTC 기준이고 몇 분 늦게 돌 수 있다. (KST = UTC + 9)
name: jobs-cron

on:
  schedule:
    - cron: "30 18 * * *"  # 매일 03:30 KST  구글 시트 백업 (14일 보관)
    - cron: "40 21 * * *"  # 매일 06:40 KST  거래처 주문 주기 계산 (브리핑 전에)
    - cron: "0 22 * * *"   # 매일 07:00 KST  아침 브리핑 카톡
    - cron: "0 19 * * 0"   # 월요일 04:00 KST 카카오 토큰 갱신
    - cron: "0 0 1 * *"    # 매월 1일 09:00 KST 지난달 거래명세표 생성
  workflow_dispatch:
    inputs:
      job:
        description: "실행할 작업"
        required: true
        type: choice
        options: [morning_briefing, reorder_scan, stock_check, kakao_token_refresh, monthly_settlement, sheet_backup]

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.API_BASE_URL != '' }}
    steps:
      - name: 작업 고르기
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "30 18 * * *") echo "job=sheet_backup" >> "$GITHUB_OUTPUT" ;;
            "40 21 * * *") echo "job=reorder_scan" >> "$GITHUB_OUTPUT" ;;
            "0 22 * * *")  echo "job=morning_briefing" >> "$GITHUB_OUTPUT" ;;
            "0 19 * * 0")  echo "job=kakao_token_refresh" >> "$GITHUB_OUTPUT" ;;
            "0 0 1 * *")   echo "job=monthly_settlement" >> "$GITHUB_OUTPUT" ;;
            *)             echo "job=${{ inputs.job }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: 서버 깨우기
        run: curl -fsS --retry 5 --retry-delay 15 --max-time 90 "${{ vars.API_BASE_URL }}/api/health"
      - name: 실행 (${{ steps.pick.outputs.job }})
        run: |
          curl -fsS --retry 3 --retry-delay 20 --max-time 180 -X POST \
            -H "X-Job-Secret: ${{ secrets.JOB_SECRET }}" \
            "${{ vars.API_BASE_URL }}/api/jobs/${{ steps.pick.outputs.job }}"

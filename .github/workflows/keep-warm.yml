# 부모님이 일하시는 시간(평일·토 07~19시 KST)에 10분마다 서버를 깨워 둔다.
# Render 무료 서버는 15분 동안 요청이 없으면 잠들어, 첫 화면이 50초 넘게 걸릴 수 있기 때문.
# (Render Starter 유료로 바꾸면 이 파일은 지워도 된다)
#
# 저장소 Settings → Secrets and variables → Actions → Variables 에 API_BASE_URL 을 넣어 주세요.
# 예: https://factory-ops-api.onrender.com
name: keep-warm

on:
  schedule:
    - cron: "*/10 22-23 * * 0-5"   # KST 07~08시 (UTC 전날 22~23시, 일~금)
    - cron: "*/10 0-9 * * 1-6"     # KST 09~18시 (UTC 0~9시, 월~토)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_BASE_URL != '' }}
    steps:
      - run: curl -fsS --max-time 90 "${{ vars.API_BASE_URL }}/api/health" || true
